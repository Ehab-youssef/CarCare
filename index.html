<style>
:root{--bg:#faeded;--card:#fff;--tx:#14163a;--mut:#667;--ln:#e3d6d6;--nv:#0b1a6b;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#13151f;--card:#1e2231;--tx:#eef0ff;--mut:#9aa;--ln:#333a52}}
:root[data-theme="dark"]{--bg:#13151f;--card:#1e2231;--tx:#eef0ff;--mut:#9aa;--ln:#333a52}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Tahoma,"Segoe UI",Arial,sans-serif;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
header{direction:ltr;background:linear-gradient(to right,#3fbcf5,#0b1a6b);padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;color:#fff}
header img{height:64px;border-radius:12px;cursor:pointer}.en{cursor:pointer}
.en{font:900 clamp(1.8rem,6vw,3.2rem) "Arial Black",Impact,sans-serif;letter-spacing:1px;text-shadow:0 2px 6px #0006}
.ar{font:900 clamp(1.1rem,3.5vw,1.8rem) Tahoma,sans-serif}.y{color:#ffd21f}.w{color:#fff}
main{flex:1;width:100%;max-width:900px;margin:0 auto;padding:18px 14px}
footer{direction:ltr;background:var(--nv);color:#fff;text-align:center;padding:12px 10px calc(12px + env(safe-area-inset-bottom,0px));font-size:.9rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:16px}
.ic{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 8px;background:var(--card);border:1px solid var(--ln);border-radius:20px;color:var(--tx);font:inherit;font-weight:700;cursor:pointer;box-shadow:0 6px 14px #0002}
.ic img{width:100%;max-width:110px;aspect-ratio:1;border-radius:50%;box-shadow:0 5px 12px #0004}
.bd{position:absolute;top:6px;inset-inline-start:6px;background:#e11;color:#fff;border-radius:50%;width:26px;height:26px;display:grid;place-items:center;font-weight:900}
.card,form{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:14px;margin-top:12px}
form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.one{max-width:420px;margin:12px auto;grid-template-columns:1fr}
label{font-size:.85rem;color:var(--mut);display:flex;flex-direction:column;gap:4px}
input,select{padding:9px;border-radius:8px;border:1px solid var(--ln);background:var(--bg);color:var(--tx);font:inherit}
button.b,a.b{padding:10px 16px;border:0;border-radius:10px;background:linear-gradient(to left,#0b1a6b,#3fbcf5);color:#fff;font:inherit;font-weight:700;cursor:pointer;align-self:end;text-decoration:none;text-align:center;display:inline-block}
.lk{background:none;border:0;color:#1a56d6;font:inherit;font-weight:700;cursor:pointer;padding:6px}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-top:10px}
.row b{color:var(--mut);font-weight:400}.x{background:#d33}.tag{padding:2px 8px;border-radius:8px;background:#3fbcf5;color:#003;font-size:.8rem}.tag.r{background:#e11;color:#fff}
#msg{color:#e11;font-weight:700;text-align:center}table{width:100%;border-collapse:collapse}td,th{padding:6px;border-bottom:1px solid var(--ln);text-align:start;font-size:.9rem}
.rl{width:46px;height:46px;border-radius:50%;background:var(--nv);color:#ffd21f;display:grid;place-items:center;font-weight:900;font-size:1.3rem}
@media print{header,footer,.no,form,#tb,#bb{display:none!important}body{background:#fff;color:#000}}
.tbr,.bbr{direction:ltr;display:flex;justify-content:space-between;align-items:center;gap:8px}.bbr{margin-top:22px;flex-wrap:wrap}.tb{margin-bottom:8px}
.pd{background:#d11;color:#fff;border:0;border-radius:10px;padding:8px 18px;font:inherit;font-weight:700;cursor:pointer}
.al{background:#d11;color:#fff;text-align:center;padding:10px;border-radius:10px;margin-top:8px;font-weight:700}
.lgb{width:46px;height:46px;object-fit:contain;background:#fff;border-radius:50%;padding:3px;border:1px solid var(--ln)}
.em{font-size:2.4rem}.ic.sl{outline:3px solid #3fbcf5}th.s{cursor:pointer;text-decoration:underline}
button.b.x{background:#d33}button.b.sm{font-size:.75em;padding:7px 12px}
